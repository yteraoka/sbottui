name: golangci-lint

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          # lint に goreleaser は不要。全部入れると goreleaser の
          # attestation 検証で落ちることがあるため対象を絞る
          install_args: go golangci-lint
      - name: Run golangci-lint
        run: golangci-lint run

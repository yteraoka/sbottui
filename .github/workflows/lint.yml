name: golangci-lint

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          # lint に goreleaser は不要。全部入れると goreleaser の
          # attestation 検証で落ちることがあるため対象を絞る
          install_args: go golangci-lint
      - name: Run golangci-lint
        run: golangci-lint run
